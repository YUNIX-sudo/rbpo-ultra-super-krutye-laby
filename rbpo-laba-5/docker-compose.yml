services:
  postgres:
    image: postgres:16-alpine
    container_name: rbpo-laba4-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rbpo_db}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
