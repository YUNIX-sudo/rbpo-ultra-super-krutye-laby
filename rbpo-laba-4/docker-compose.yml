services:
  postgres:
    image: postgres:16-alpine
    container_name: rbpo-laba4-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rbpo_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
